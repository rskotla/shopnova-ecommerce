apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopnova-web
  namespace: shopnova
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopnova-web
  template:
    metadata:
      labels:
        app: shopnova-web
    spec:
      containers:
        - name: web
          image: rohitkotla/shopnova-web:11
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: shopnova
spec:
  type: ClusterIP
  selector:
    app: shopnova-web
  ports:
    - name: http
      port: 80
      targetPort: 80
