apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopnova-web
  namespace: shopnova
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopnova-web
  template:
    metadata:
      labels:
        app: shopnova-web
    spec:
      containers:
        - name: web
          image: YOUR_DOCKERHUB_USER/shopnova-web:1.0.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: shopnova-web
  namespace: shopnova
spec:
  selector:
    app: shopnova-web
  ports:
    - port: 80
      targetPort: 80
