apiVersion: v1
kind: Secret
metadata:
  name: shopnova-db
  namespace: shopnova
type: Opaque
stringData:
  POSTGRES_DB: shopnova
  POSTGRES_USER: shopnova
  POSTGRES_PASSWORD: REPLACE_WITH_A_STRONG_SECRET_BEFORE_APPLY
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shopnova-postgres-data
  namespace: shopnova
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopnova-postgres
  namespace: shopnova
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopnova-postgres
  template:
    metadata:
      labels:
        app: shopnova-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: shopnova-db, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: shopnova-db, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: shopnova-db, key: POSTGRES_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB""]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shopnova-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: shopnova-postgres
  namespace: shopnova
spec:
  selector:
    app: shopnova-postgres
  ports:
    - port: 5432
      targetPort: 5432
