apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopnova-api
  namespace: shopnova
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopnova-api
  template:
    metadata:
      labels:
        app: shopnova-api
    spec:
      containers:
        - name: api
          image: rohitkotla/shopnova-api:18
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopnova-db-password
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+psycopg://shopnova:$(POSTGRES_PASSWORD)@postgres:5432/shopnova"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shopnova-secrets
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shopnova-secrets
                  key: JWT_SECRET_KEY
            - name: CORS_ORIGINS
              value: "http://localhost:8080,http://localhost:5173"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shopnova
spec:
  type: ClusterIP
  selector:
    app: shopnova-api
  ports:
    - name: http
      port: 5000
      targetPort: 5000
