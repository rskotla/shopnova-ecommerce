
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopnova
  namespace: shopnova
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
